<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 592" width="1200" height="592" role="img" aria-labelledby="t d">
  <title id="t">homa: a peer-to-peer terminal chat</title>
  <desc id="d">Two terminals side by side showing one real conversation. On the left, sara calls mohsen and waits to be let in. On the right, mohsen is asked whether to take the call, accepts, and the two exchange messages. Nothing sits between them.</desc>

  <rect width="1200" height="592" rx="14" fill="#0d0f12"/>

  <!-- identity -->
  <text x="48" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="58" font-weight="700" fill="#e6e3dd">homa</text>
  <text x="215" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" fill="#d8a657">peer-to-peer terminal chat</text>
  <text x="48" y="126" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#9aa1ae">Two machines exchange one address, then talk directly.</text>
  <text x="48" y="156" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" fill="#9aa1ae">Encrypted, through NAT, with no account and no server in the middle.</text>

  <!-- the gap between them is the point: nothing is drawn in it but the link -->
  <line x1="583" y1="361" x2="617" y2="361" stroke="#d8a657" stroke-width="2"/>
  <circle cx="583" cy="361" r="4" fill="#d8a657"/>
  <circle cx="617" cy="361" r="4" fill="#d8a657"/>

  <!-- left terminal: the caller -->
  <rect x="48" y="206" width="535" height="310" rx="10" fill="#14171c" stroke="#242932" stroke-width="1"/>
  <rect x="48" y="206" width="535" height="40" rx="10" fill="#1a1e25"/>
  <rect x="48" y="236" width="535" height="10" fill="#1a1e25"/>
  <text x="70" y="233" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#7c8391">sara's terminal</text>
  <text x="561" y="233" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#5b6270">calling</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">
    <text x="70" y="288" fill="#7c8391">&gt; choice: <tspan fill="#e6e3dd">1</tspan></text>
    <text x="70" y="322" fill="#9aa1ae">  calling mohsen...</text>
    <text x="70" y="356" fill="#9aa1ae">  waiting for mohsen to answer... 56s</text>
    <text x="70" y="412" fill="#d8a657">[me]<tspan fill="#e6e3dd"> salam</tspan></text>
    <text x="70" y="446" fill="#7c8391">[mohsen]<tspan fill="#e6e3dd"> salam sara, chetori</tspan></text>
    <text x="70" y="480" fill="#d8a657">[me] <tspan fill="#e6e3dd">█</tspan></text>
  </g>

  <!-- right terminal: the one being called -->
  <rect x="617" y="206" width="535" height="310" rx="10" fill="#14171c" stroke="#242932" stroke-width="1"/>
  <rect x="617" y="206" width="535" height="40" rx="10" fill="#1a1e25"/>
  <rect x="617" y="236" width="535" height="10" fill="#1a1e25"/>
  <text x="639" y="233" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#7c8391">mohsen's terminal</text>
  <text x="1130" y="233" text-anchor="end" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#5b6270">being called</text>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">
    <text x="639" y="288" fill="#9aa1ae">  ~sara is calling (expires in 1m0s).</text>
    <text x="639" y="322" fill="#7c8391">&gt; take the call from ~sara? [56s] [y/N]: <tspan fill="#e6e3dd">y</tspan></text>
    <text x="639" y="356" fill="#9aa1ae">  connected to ~sara</text>
    <text x="639" y="412" fill="#7c8391">[~sara]<tspan fill="#e6e3dd"> salam</tspan></text>
    <text x="639" y="446" fill="#d8a657">[me]<tspan fill="#e6e3dd"> salam sara, chetori</tspan></text>
    <text x="639" y="480" fill="#d8a657">[me] <tspan fill="#e6e3dd">█</tspan></text>
  </g>

  <!-- the tilde is the one rule worth explaining on sight -->
  <text x="48" y="556" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" fill="#5b6270">A name in brackets is the one you gave them. A ~ in front means they chose it themselves.</text>
</svg>
