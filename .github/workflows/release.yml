# A tag starting with v runs GoReleaser: binaries, a .deb, checksums, a GitHub
# release, and the Homebrew formula pushed to Serajian/homebrew-homa.
#
# GITHUB_TOKEN is provided by Actions and can only write to this repository.
# Pushing the formula to the tap needs a token of its own, stored as the
# HOMEBREW_TAP_GITHUB_TOKEN secret.
#
# The apt repository is published by apt.yml, started from here by hand at the
# end: a release created with GITHUB_TOKEN raises no "published" event that
# another workflow would see, and workflow_dispatch is the exception to that.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  actions: write # to start apt.yml

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the changelog and the version come from git history

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      - name: Publish to apt
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run apt.yml -f tag="${{ github.ref_name }}"
