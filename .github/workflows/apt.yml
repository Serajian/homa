# Publishes the .deb files of a release to the apt repository on GitHub
# Pages: the gh-pages branch of this repository, served at
# https://serajian.github.io/homa. Runs when a release is published, and by
# hand for a release that already exists.
#
# The release workflow dispatches this one at its end rather than relying on
# the release event: a release created with GITHUB_TOKEN raises no events that
# start other workflows, so the "published" trigger below only fires for a
# release made by hand. workflow_dispatch is the documented exception.
#
# The packages come from the release itself, not from a build here, so this
# publishes exactly what people can also download by hand. Signing needs the
# APT_GPG_PRIVATE_KEY secret: a key made for this and nothing else.
name: apt

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish (empty: the latest release)"
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find the release
        id: rel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.event.inputs.tag || github.event.release.tag_name }}"
          if [ -z "$tag" ]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          mkdir incoming
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.deb' --dir incoming
          ls -l incoming

      - name: Tools
        # The runner image carries third-party repositories of its own, and
        # one of them serving a broken index is not a reason to stop
        # publishing homa. The update is allowed to complain; the install
        # below is the step that has to succeed, and it says so loudly when
        # the lists it needs really are missing.
        run: |
          sudo apt-get update -q || echo "some repository is unhappy; carrying on"
          sudo apt-get install -y -q dpkg-dev apt-utils gnupg

      - name: Signing key
        run: |
          printf '%s\n' "${{ secrets.APT_GPG_PRIVATE_KEY }}" | gpg --batch --import
          gpg --batch --list-secret-keys --keyid-format long

      - name: Check out gh-pages, or start it
        run: |
          # The checkout is shallow and brings one branch; the pages branch
          # has to be fetched by name before a worktree can be made of it.
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            git fetch --no-tags origin gh-pages:gh-pages
            git worktree add site gh-pages
          else
            git worktree add --orphan -b gh-pages site
          fi

      - name: Build the repository
        run: |
          .github/apt/build.sh incoming site "${{ steps.rel.outputs.tag }}"
          cp .github/apt/index.html site/index.html

      - name: Publish
        run: |
          cd site
          git add -A
          git -c user.name="serajian.mohsen" -c user.email="serajian.mohsen@gmail.com" \
            commit -m "apt: homa ${{ steps.rel.outputs.tag }}" || { echo "nothing new"; exit 0; }
          git push origin gh-pages
